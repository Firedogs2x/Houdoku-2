name: Build + Lint
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        node: ['22']
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build
      - run: pnpm lint
