name: Build & Release Houdoku

# -----------------------------------------------------------------
# 1️⃣ Triggers
# -----------------------------------------------------------------
on:
  # Manual start from the Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.18.0)"
        required: true

  # OPTIONAL: automatic run when a tag like v2.18.0 is pushed
  # push:
  #   tags:
  #     - 'v*'

# -----------------------------------------------------------------
# 2️⃣ Permissions – needed to create a GitHub Release and upload assets
# -----------------------------------------------------------------
permissions:
  contents: write   # for releases (upload, create tag, etc.)

# -----------------------------------------------------------------
# 3️⃣ Job – matrix runs on Windows, macOS and Linux
# -----------------------------------------------------------------
jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # -------------------------------------------------------------
      # 0️⃣ Checkout the repo
      # -------------------------------------------------------------
      - uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1️⃣ Install Node (20) and enable pnpm
      # -------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm               # caches ~/.pnpm-store between runs

      # Corepack ships with Node 20; this makes pnpm available in $PATH.
      - name: Enable pnpm via Corepack
        run: corepack enable

      # (If you prefer the npm‑global way, replace the two lines above with:)
      # - name: Install pnpm globally
      #   run: npm install -g pnpm

      # -------------------------------------------------------------
      # 2️⃣ Install workspace dependencies
      # -------------------------------------------------------------
      - name: Install deps
        run: pnpm install

      # -------------------------------------------------------------
      # 3️⃣ Bump the version (must happen **before** any build)
      # -------------------------------------------------------------
      - name: Bump version
        run: |
          pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

          # OPTIONAL: if you ever want to use the `onTagOrDraft` mode,
          # you can create a tag here so that electron‑builder sees it.
          # git config user.name "github-actions[bot]"
          # git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add .
          # git commit -m "chore: release v${{ github.event.inputs.version }}" || echo "nothing to commit"
          # git tag v${{ github.event.inputs.version }}
          # git push origin HEAD:${{ github.ref }} --tags

      # -------------------------------------------------------------
      # 4️⃣ Build the renderer & main process (Turbo)
      # -------------------------------------------------------------
      - name: Build (Turbo)
        run: pnpm build

      # -------------------------------------------------------------
      # 5️⃣ Platform‑specific packaging (electron‑builder)
      # -------------------------------------------------------------
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run dist:win   # script contains: electron-builder --win --publish always

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run dist:mac

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run dist:linux

      # -------------------------------------------------------------
      # 6️⃣ (Optional) Upload the artefacts as CI artefacts
      #    – useful for debugging if the GitHub Release upload fails.
      # -------------------------------------------------------------
      - name: Upload Windows artefacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*

      - name: Upload macOS artefacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*

      - name: Upload Linux artefacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: release/*
