name: Build and Release Houdoku

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 2.17.1)"
        required: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build

      - name: Set version
        run: pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

      - run: pnpm dist:win

  macos:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build

      - name: Set version
        run: pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

      - run: pnpm dist:mac

  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build

      - name: Set version
        run: pnpm version ${{ github.event.inputs.version }} --no-git-tag-version

      - run: pnpm dist:linux
