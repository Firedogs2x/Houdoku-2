# ──────────────────────────────────────────────────────────────────────
# Build & Release Houdoku
# ──────────────────────────────────────────────────────────────────────
name: Build & Release Houdoku

# ----------------------------------------------------------------------
# 1️⃣  Triggers – manual UI only (drop‑down for bump type)
# ----------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type – choose the version change you want"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# ----------------------------------------------------------------------
# 2️⃣  Permissions – needed to create a Release and upload assets
# ----------------------------------------------------------------------
permissions:
  contents: write   # allows creating a GitHub Release + uploading artefacts

# ----------------------------------------------------------------------
# 3️⃣  Job – matrix runs on the three supported OSes
# ----------------------------------------------------------------------
jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically by GitHub

    steps:
      # ------------------------------------------------------------------
      # 0️⃣  Checkout the repository
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1️⃣  Install Node (v20) and make pnpm available
      # ------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm               # caches the pnpm store after pnpm exists

      # Corepack ships with Node ≥ 16 – this makes pnpm available in $PATH
      - name: Enable pnpm via Corepack
        run: corepack enable

      # (If you prefer the npm‑global approach, replace the two lines above
      # with:  run: npm install -g pnpm)

      # ------------------------------------------------------------------
      # 2️⃣  Install workspace dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: pnpm install

      # ------------------------------------------------------------------
      # 3️⃣  Bump the version (must happen before any build)
      # ------------------------------------------------------------------
      - name: Bump version
        run: |
          # The UI gave us a bump type (patch / minor / major)
          pnpm version ${{ github.event.inputs.bump }} --no-git-tag-version

          # OPTIONAL: create & push a matching Git tag.
          # This is handy if you ever switch the electron‑builder scripts
          # to use "--publish onTagOrDraft".
          # ---------------------------------------------------------
          # git config user.name  "github-actions[bot]"
          # git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # NEW_TAG="v$(node -p "require('./package.json').version")"
          # git tag "$NEW_TAG"
          # git push origin "$NEW_TAG"
          # ---------------------------------------------------------

      # ------------------------------------------------------------------
      # 4️⃣  Build the renderer & main process (Turbo)
      # ------------------------------------------------------------------
      - name: Build (Turbo)
        run: pnpm build

      # ------------------------------------------------------------------
      # 5️⃣  Platform‑specific packaging (electron‑builder)
      # ------------------------------------------------------------------
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run dist:win   # → "electron-builder --win --publish always"

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run dist:mac   # → "electron-builder --mac --publish always"

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run dist:linux # → "electron-builder --linux --publish always"

      # ------------------------------------------------------------------
      # 6️⃣  (Optional) Upload the artefacts as CI artefacts
      # ------------------------------------------------------------------
      - name: Upload Windows artefacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*

      - name: Upload macOS artefacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*

      - name: Upload Linux artefacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: release/*
