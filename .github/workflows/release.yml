name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          git fetch --tags
          latest=$(git tag -l 'V*' --sort=-v:refname | head -n 1)
          latest=${latest#V}
          IFS='.' read -r major minor patch <<< "$latest"

          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          echo "version=V$major.$minor.$patch" >> $GITHUB_OUTPUT

      - run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}

  build:
    needs: tag
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: corepack prepare pnpm@latest --activate
      - run: pnpm install

      # 🔒 build ONLY the desktop app
      - run: pnpm --filter @houdoku/desktop build

      - name: Package desktop app
        shell: bash
        run: |
          cd apps/desktop
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pnpm dist:linux
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm dist:win
          else
            pnpm dist:mac
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
            tag_name: ${{ github.ref_name }}
            overwrite_files: true
            files: |
                apps/desktop/release/*.AppImage
                apps/desktop/release/*.exe
                apps/desktop/release/*.nsis
                apps/desktop/release/*.dmg
                apps/desktop/release/*.zip

