name: Build & Release Houdoku

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select the semver bump you want for this release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      # ─────────────────────────────────────────────
      # VERSION + TAG (CAPITAL V, RUNS ONCE)
      # ─────────────────────────────────────────────
      - name: Bump version and create V tag
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pnpm version ${{ github.event.inputs.bump }} --no-git-tag-version

          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          git add package.json
          git commit -m "Release V$VERSION"

          git tag "V$VERSION"
          git push origin main
          git push origin "V$VERSION"

      - name: Build
        run: pnpm build

      # ─────────────────────────────────────────────
      # PACKAGE
      # ─────────────────────────────────────────────
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run dist:win

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run dist:mac

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run dist:linux

      # ─────────────────────────────────────────────
      # CREATE RELEASE (CAPITAL V)
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ env.VERSION }}
          name: Houdoku V${{ env.VERSION }}
          draft: false
          prerelease: false

      # ─────────────────────────────────────────────
      # UPLOAD ASSETS
      # ─────────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ env.VERSION }}
          files: release/*
