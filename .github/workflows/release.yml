name: Build and Release Houdoku

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Bump version?"
        type: boolean
        default: false
      version_bump_type:
        description: "Version bump type"
        type: choice
        default: patch
        options: [patch, minor, major]

  push:
    tags:
      - "v*"


jobs:
  bump:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g pnpm

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          npm version ${{ inputs.version_bump_type }}
          git push --follow-tags


      - id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_PUBLISH: onTagOrDraft
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm dist:win

  macos:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_PUBLISH: onTagOrDraft
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm dist:mac

  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_PUBLISH: onTagOrDraft
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0
            
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm dist:linux
