name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: official
        options:
          - official
          - nightly
      bump:
        description: Version bump type
        type: choice
        required: false
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}
      app_version: ${{ steps.version.outputs.app_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Calculate release metadata
        shell: bash
        run: |
          git fetch --tags
          latest_official=$(git tag -l 'V*' --sort=-v:refname | head -n 1)

          if [ -z "$latest_official" ]; then
            latest_official="V0.0.0"
          fi

          if [ "${{ inputs.release_type }}" = "nightly" ]; then
            timestamp_tag=$(date -u +"%Y%m%d-%H%M")
            timestamp_label=$(date -u +"%d/%m/%Y %I:%M %p")

            base_version=${latest_official#V}
            app_version="${base_version}-nightly.${timestamp_tag//-/}"

            echo "version=nightly-${timestamp_tag}" >> "$GITHUB_OUTPUT"
            echo "release_name=Nightly – ${timestamp_label} UTC" >> "$GITHUB_OUTPUT"
            echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            latest=${latest_official#V}
            IFS='.' read -r major minor patch <<< "$latest"

            case "${{ inputs.bump }}" in
              major)
                major=$((major+1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor+1))
                patch=0
                ;;
              patch)
                patch=$((patch+1))
                ;;
            esac

            version="V$major.$minor.$patch"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "release_name=Houdoku ${version}" >> "$GITHUB_OUTPUT"
            echo "app_version=${version#V}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

  build:
    needs: tag
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      # 🔧 FIX #3 — sync Electron app version to tag
      - name: Sync app version to release tag
        shell: bash
        run: |
          VERSION="${{ needs.tag.outputs.app_version }}"
          
          # Update apps/desktop/package.json using Node.js directly
          # This is more reliable in pnpm monorepos than using npm version
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf-8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated ' + path + ' version to ' + pkg.version);
          "

      - name: Build desktop app
        run: pnpm --filter @houdoku/desktop build

      - name: Package desktop app
        shell: bash
        run: |
          cd apps/desktop
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pnpm run dist:linux
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm run dist:win
          else
            pnpm run dist:mac
          fi

      # 🔧 FIX #2 — enforce tag-based release + proper title
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: ${{ needs.tag.outputs.release_name }}
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          overwrite_files: true
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
            apps/desktop/release/*.nsis
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
