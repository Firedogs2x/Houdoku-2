name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: official
        options:
          - official
          - nightly
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      app_version: ${{ steps.meta.outputs.app_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - id: meta
        name: Calculate release metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          latest=$(git tag -l 'V*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            latest="V0.0.0"
          fi

          base_version=${latest#V}
          release_type="${{ inputs.release_type }}"

          if [ "$release_type" = "official" ]; then
            IFS='.' read -r major minor patch <<< "$base_version"

            case "${{ inputs.bump }}" in
              major)
                major=$((major+1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor+1))
                patch=0
                ;;
              patch)
                patch=$((patch+1))
                ;;
            esac

            tag_name="V$major.$minor.$patch"
            release_name="Houdoku $tag_name"
            app_version="${tag_name#V}"
            prerelease="false"
          else
            nightly_stamp="$(date -u +"%Y%m%d-%H%M")"
            nightly_display="$(date -u +"%d/%m/%Y %I:%M %p" | tr '[:upper:]' '[:lower:]')"

            # Keep git ref safe while exposing a friendly release title.
            tag_name="nightly-$nightly_stamp"
            release_name="Nightly - $nightly_display UTC"
            app_version="$base_version-nightly.${GITHUB_RUN_NUMBER:-0}"
            prerelease="true"
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.meta.outputs.tag_name }}"
          git push origin "${{ steps.meta.outputs.tag_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

  build:
    needs: tag
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5.0.1
        with:
          ref: ${{ needs.tag.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # 🔧 FIX #3 — sync Electron app version to tag
      - name: Sync app version to release tag
        shell: bash
        run: |
          VERSION="${{ needs.tag.outputs.app_version }}"
          
          # Update apps/desktop/package.json using Node.js directly
          # This is more reliable in pnpm monorepos than using npm version
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf-8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated ' + path + ' version to ' + pkg.version);
          "

      - name: Build desktop app
        run: pnpm --filter @houdoku/desktop build

      - name: Package desktop app
        shell: bash
        run: |
          cd apps/desktop
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pnpm run dist:linux
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm run dist:win
          else
            pnpm run dist:mac
          fi

      # Upload Linux artifacts only from Linux runner to avoid cross-OS release asset races.
      - name: Upload Linux release assets
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.release_name }}
          prerelease: ${{ needs.tag.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/*.blockmap

      # Upload Windows artifacts only from Windows runner to avoid cross-OS release asset races.
      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.release_name }}
          prerelease: ${{ needs.tag.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.nsis
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap

      # Upload macOS artifacts only from macOS runner to avoid cross-OS release asset races.
      - name: Upload macOS release assets
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: ${{ needs.tag.outputs.release_name }}
          prerelease: ${{ needs.tag.outputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
